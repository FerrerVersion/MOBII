plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "com.jorgeferrergil.mobii"

    defaultConfig {
        applicationId "com.jorgeferrergil.mobii"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView y CardView — para listas
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Material Design — FloatingActionButton, TextInputLayout, etc.
    implementation 'com.google.android.material:material:1.11.0'

    // Retrofit + Gson — conexión API REST y conversión JSON → Java
    // Siguiendo el patrón del Ejercicio 2 (Bestiario Zelda)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // ORMLite — base de datos local SQLite sin escribir SQL
    // Se usa para cachear parkings y guardar reservas de taxi
    implementation 'com.j256.ormlite:ormlite-android:5.7'

    // Glide — carga de imágenes (fotos del equipo en Quiénes Somos)
    // Nota: se elimina el annotationProcessor para evitar conflicto con AGP 8.3
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
